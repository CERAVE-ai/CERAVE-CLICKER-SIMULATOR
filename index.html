<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeraVe Clicker Simulator - Visual Overhaul</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #f0f9ff 0%, #bae6fd 100%);
            color: #1e40af;
            overflow: hidden;
            user-select: none;
        }

        /* Burbujas de fondo */
        .bg-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: floatBubble 10s linear infinite;
            z-index: 0;
        }

        @keyframes floatBubble {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* Pantalla de Inicio */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #loading-screen.hidden { transform: translateY(-100%); }

        .play-button {
            background: #1e40af;
            color: white;
            padding: 20px 60px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .play-button:hover {
            transform: scale(1.1) rotate(2deg);
            background: #1d4ed8;
        }

        /* Animación del Bote */
        .bottle-container {
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 20px 30px rgba(30, 64, 175, 0.2));
        }

        .bottle-container:active {
            transform: scale(0.92) skewX(2deg);
        }

        .floating-bottle { animation: idleFloat 4s ease-in-out infinite; }
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(-1deg); }
        }

        /* Textos flotantes */
        .floating-text {
            position: absolute;
            pointer-events: none;
            animation: textRise 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            font-weight: 900;
            z-index: 60;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        @keyframes textRise {
            0% { transform: translateY(0) scale(0.5) rotate(-10deg); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.8) rotate(0deg); opacity: 0; }
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border: 4px solid #3b82f6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rippleAnim 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes rippleAnim {
            0% { width: 0; height: 0; opacity: 0.8; border-width: 8px; }
            100% { width: 250px; height: 250px; opacity: 0; border-width: 1px; }
        }

        /* Partículas mejoradas */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 55;
            animation: dropOut 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes dropOut {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 10px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .cosmic-upgrade {
            background: linear-gradient(45deg, #1e1b4b, #312e81, #4338ca);
            background-size: 200% 200%;
            animation: gradientMove 3s infinite, pulseCosmic 2s infinite alternate;
            border: 2px solid #fbbf24 !important;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseCosmic {
            from { box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
            to { box-shadow: 0 0 30px rgba(251, 191, 36, 0.9); }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div id="bg-elements"></div>

    <!-- Pantalla de Inicio -->
    <div id="loading-screen">
        <div class="mb-10 scale-150 relative">
            <div class="absolute inset-0 bg-blue-400 blur-[40px] opacity-20 animate-pulse"></div>
            <svg width="100" height="130" viewBox="0 0 120 160">
                <rect x="25" y="45" width="70" height="110" rx="10" fill="white" stroke="#1e40af" stroke-width="3"/>
                <rect x="25" y="55" width="70" height="40" fill="#1e40af"/>
                <text x="60" y="82" font-family="Arial" font-size="14" font-weight="900" fill="white" text-anchor="middle">CeraVe</text>
            </svg>
        </div>
        <h1 class="text-6xl font-black text-blue-900 mb-2 tracking-tighter text-center">CERAVE CLICKER</h1>
        <p class="text-blue-400 font-bold mb-10 tracking-widest uppercase">Visual Evolution</p>
        <button class="play-button" onclick="startGame()">EMPEZAR RUTINA</button>
    </div>

    <!-- UI Principal -->
    <div id="game-ui" class="contents">
        <!-- Stats -->
        <div class="fixed top-0 left-0 w-full p-8 flex justify-around bg-white/40 backdrop-blur-xl border-b border-white/20 z-40 shadow-xl">
            <div class="text-center group">
                <p class="text-[10px] text-blue-400 uppercase font-black transition-colors group-hover:text-blue-600">Hidratación</p>
                <p id="energy-display" class="text-3xl font-extrabold text-blue-700 drop-shadow-sm">0</p>
            </div>
            <div class="text-center group">
                <p class="text-[10px] text-blue-400 uppercase font-black transition-colors group-hover:text-sky-600">Poder de Brillo</p>
                <p id="multiplier-display" class="text-3xl font-extrabold text-sky-500 drop-shadow-sm">x1</p>
            </div>
            <div class="text-center group">
                <p class="text-[10px] text-blue-400 uppercase font-black transition-colors group-hover:text-indigo-600">Día de Rutina</p>
                <p id="rebirth-display" class="text-3xl font-extrabold text-indigo-800 drop-shadow-sm">0</p>
            </div>
        </div>

        <main id="game-area" class="relative w-full h-full flex items-center justify-center overflow-hidden">
            <div id="click-btn" class="bottle-container floating-bottle relative z-10 cursor-pointer">
                <!-- Aura de brillo -->
                <div class="absolute inset-0 bg-blue-400/30 blur-[120px] rounded-full scale-150 animate-pulse"></div>
                
                <!-- Bote Detallado -->
                <svg width="260" height="340" viewBox="0 0 120 160" fill="none">
                    <!-- Cabezal -->
                    <path d="M45 5 C45 5 45 2 60 2 C75 2 75 5 75 5 L75 15 L45 15 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
                    <rect x="56" y="15" width="8" height="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
                    <rect x="35" y="30" width="50" height="8" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
                    
                    <!-- Cuerpo con degradado sutil -->
                    <defs>
                        <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#ffffff" />
                            <stop offset="50%" style="stop-color:#f8fafc" />
                            <stop offset="100%" style="stop-color:#f1f5f9" />
                        </linearGradient>
                    </defs>
                    <path d="M25 45 C25 40 30 38 35 38 L85 38 C90 38 95 40 95 45 L95 145 C95 152 90 155 85 155 L35 155 C30 155 25 152 25 145 Z" fill="url(#bottleGrad)" stroke="#1e40af" stroke-width="2.5"/>
                    
                    <!-- Etiqueta -->
                    <rect x="25" y="55" width="70" height="40" fill="#1e40af"/>
                    <text x="60" y="82" font-family="Arial" font-size="14" font-weight="900" fill="white" text-anchor="middle">CeraVe</text>
                    
                    <!-- Detalles -->
                    <text x="32" y="105" font-family="Arial" font-size="4" font-weight="bold" fill="#1e40af">Moisturizing Lotion</text>
                    <rect x="32" y="110" width="50" height="1.5" rx="0.5" fill="#0ea5e9"/>
                    <rect x="32" y="115" width="40" height="1" rx="0.5" fill="#94a3b8"/>
                    <rect x="25" y="140" width="70" height="3" fill="#0ea5e9" opacity="0.6"/>
                </svg>
            </div>
        </main>

        <!-- Navegación -->
        <div class="fixed bottom-10 w-full max-w-md px-6 z-40">
            <div class="bg-white/80 backdrop-blur-2xl border border-white/50 rounded-[3rem] flex justify-between p-3 shadow-[0_20px_50px_rgba(0,0,0,0.1)]">
                <button onclick="showTab('shop')" class="group flex-1 py-4 flex flex-col items-center hover:bg-blue-50/50 rounded-[2rem] transition-all">
                    <span class="text-3xl group-hover:scale-125 transition-transform">🧴</span>
                    <span class="text-[10px] uppercase font-black text-blue-800 mt-2">Tienda</span>
                </button>
                <button onclick="showTab('pets')" class="group flex-1 py-4 flex flex-col items-center hover:bg-blue-50/50 rounded-[2rem] transition-all">
                    <span class="text-3xl group-hover:scale-125 transition-transform">✨</span>
                    <span class="text-[10px] uppercase font-black text-blue-800 mt-2">Sérums</span>
                </button>
                <button onclick="showTab('rebirth')" class="group flex-1 py-4 flex flex-col items-center hover:bg-blue-50/50 rounded-[2rem] transition-all">
                    <span class="text-3xl group-hover:scale-125 transition-transform">🔄</span>
                    <span class="text-[10px] uppercase font-black text-blue-800 mt-2">Rutina</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-container" class="fixed inset-0 bg-blue-900/60 backdrop-blur-lg z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-lg rounded-[4rem] shadow-2xl flex flex-col max-h-[85vh] overflow-hidden transform transition-all scale-95 opacity-0" id="modal-box">
            <div class="p-10 border-b flex justify-between items-center bg-blue-50/30">
                <h2 id="modal-title" class="text-2xl font-black text-blue-900 tracking-tight">Tienda</h2>
                <button onclick="closeModal()" class="text-blue-200 hover:text-blue-900 transition-colors text-5xl">&times;</button>
            </div>
            <div id="modal-content" class="p-8 overflow-y-auto custom-scroll">
                <div id="tab-shop" class="tab-content space-y-6">
                    <div id="shop-manual" class="space-y-3"></div>
                    <div id="shop-auto" class="space-y-3 pt-6 border-t border-blue-100"></div>
                </div>
                <div id="tab-pets" class="tab-content space-y-8 text-center">
                    <div class="bg-gradient-to-br from-sky-100 to-white p-10 rounded-[3rem] border border-sky-100 shadow-inner">
                        <div class="text-7xl mb-6 animate-bounce">🧪</div>
                        <button onclick="hatchEgg()" class="w-full bg-blue-600 text-white py-5 rounded-[2rem] font-black shadow-xl hover:bg-blue-700 active:scale-95 transition-all">
                            Mezclar Sérum (<span id="cost-egg">2,500</span> 🧴)
                        </button>
                    </div>
                    <div id="pets-list" class="grid grid-cols-4 gap-4"></div>
                </div>
                <div id="tab-rebirth" class="tab-content space-y-8 text-center">
                    <div class="bg-indigo-600 p-12 rounded-[3.5rem] text-white shadow-2xl shadow-indigo-200 relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 text-9xl opacity-10">✨</div>
                        <p class="text-sm font-bold uppercase opacity-80 mb-2">Bono por Rebirth</p>
                        <p class="text-5xl font-black">X2 PODER</p>
                    </div>
                    <button onclick="doRebirth()" class="w-full bg-blue-900 text-white py-6 rounded-[2.5rem] font-black hover:bg-black active:scale-95 transition-all">
                        Reiniciar Rutina (<span id="rebirth-cost-display">50k</span>)
                    </button>
                    <button onclick="resetGame()" class="text-xs text-red-400 font-bold uppercase mt-12 hover:text-red-600">Borrar progreso de la piel</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-32 bg-white/90 backdrop-blur-md text-blue-900 border border-blue-100 px-10 py-4 rounded-full text-sm font-black shadow-[0_15px_30px_rgba(0,0,0,0.1)] opacity-0 transition-all pointer-events-none z-50"></div>

    <script>
        let gameActive = false;

        function formatNumber(num) {
            if (num >= 1e18) return (num / 1e18).toFixed(2) + 'Qi';
            if (num >= 1e15) return (num / 1e15).toFixed(2) + 'Qa';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return Math.floor(num).toLocaleString();
        }

        const PET_TYPES = [
            { name: 'Ácido', emoji: '💧', mult: 1.5, color: '#0ea5e9' },
            { name: 'Retinol', emoji: '🌙', mult: 5.0, color: '#6366f1' },
            { name: 'Niacina', emoji: '💎', mult: 10.0, color: '#22d3ee' },
            { name: 'Ceramida', emoji: '🛡️', mult: 100.0, color: '#1e40af' }
        ];

        function createBackground() {
            const container = document.getElementById('bg-elements');
            for(let i=0; i<15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bg-bubble';
                const size = Math.random() * 60 + 20;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDelay = Math.random() * 10 + 's';
                bubble.style.animationDuration = (Math.random() * 5 + 8) + 's';
                container.appendChild(bubble);
            }
        }

        function generateUpgrades() {
            const manual = [];
            const auto = [];
            const emojisManual = ['🧼', '🧽', '🧤', '🧴', '🛁', '🚿', '🧊', '🧖', '💆', '✨'];
            const emojisAuto = ['💧', '🌊', '🌬️', '🌨️', '⚡', '🔋', '🤖', '🖥️', '🛰️', '☄️'];

            for(let i=0; i<100; i++) {
                manual.push({ 
                    id: `m${i}`, 
                    name: `Limpieza Nvl ${i+1}`, 
                    cost: Math.floor(50 * Math.pow(1.8, i)), 
                    power: Math.floor(1 * Math.pow(2.2, i)), 
                    count: 0, 
                    emoji: emojisManual[i % emojisManual.length] 
                });
                
                auto.push({ 
                    id: `a${i}`, 
                    name: `Auto-Lote Nvl ${i+1}`, 
                    cost: Math.floor(500 * Math.pow(2.0, i)), 
                    power: Math.floor(10 * Math.pow(2.4, i)), 
                    count: 0, 
                    emoji: emojisAuto[i % emojisAuto.length] 
                });
            }

            auto.push({ 
                id: 'cosmic', 
                name: 'CeraVe Cósmico', 
                cost: 1e12, 
                power: 1e9, 
                count: 0, 
                emoji: '🌌', 
                isCosmic: true 
            });

            return { manual, auto };
        }

        let state = { 
            energy: 0, 
            rebirths: 0, 
            pets: [], 
            upgrades: generateUpgrades(), 
            costs: { egg: 2500, rebirth: 50000 }
        };

        function saveGame() {
            localStorage.setItem('cerave_visual_v1', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('cerave_visual_v1');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.energy = parsed.energy || 0;
                state.rebirths = parsed.rebirths || 0;
                state.pets = parsed.pets || [];
                state.costs = parsed.costs || state.costs;
                if(parsed.upgrades) {
                    parsed.upgrades.manual.forEach((u, i) => { if(state.upgrades.manual[i]) state.upgrades.manual[i].count = u.count; });
                    parsed.upgrades.auto.forEach((u) => { 
                        const found = state.upgrades.auto.find(curr => curr.id === u.id);
                        if(found) {
                            found.count = u.count;
                            found.cost = Math.floor(found.cost * Math.pow(1.6, u.count));
                        }
                    });
                }
            }
        }

        function startGame() {
            document.getElementById('loading-screen').classList.add('hidden');
            gameActive = true;
            createBackground();
            updateDisplay();
        }

        function getTotalMultiplier() {
            return Math.pow(2, state.rebirths) + state.pets.reduce((acc, p) => acc + (p.mult - 1), 0);
        }

        function updateDisplay() {
            document.getElementById('energy-display').innerText = formatNumber(state.energy);
            document.getElementById('multiplier-display').innerText = 'x' + getTotalMultiplier().toFixed(1);
            document.getElementById('rebirth-display').innerText = state.rebirths;
            document.getElementById('cost-egg').innerText = formatNumber(state.costs.egg);
            document.getElementById('rebirth-cost-display').innerText = formatNumber(state.costs.rebirth);
            renderShop();
            renderPets();
        }

        function renderShop() {
            const mCont = document.getElementById('shop-manual');
            const aCont = document.getElementById('shop-auto');
            if(!mCont || !aCont) return;
            mCont.innerHTML = '<p class="text-[10px] font-black text-blue-300 uppercase mb-3 tracking-widest">Mejoras de Dedo</p>'; 
            aCont.innerHTML = '<p class="text-[10px] font-black text-blue-300 uppercase mb-3 tracking-widest">Producción en Cadena</p>';
            
            state.upgrades.manual.filter(u => u.count > 0 || state.energy >= u.cost / 1.5).slice(0, 8).forEach(u => mCont.appendChild(createItem(u)));
            state.upgrades.auto.filter(u => u.count > 0 || state.energy >= u.cost / 1.5).slice(0, 8).forEach(u => aCont.appendChild(createItem(u)));
        }

        function createItem(u) {
            const div = document.createElement('div');
            const canAfford = state.energy >= u.cost;
            div.className = `p-5 rounded-[1.8rem] flex justify-between items-center border-2 transition-all duration-300 hover:scale-[1.02] active:scale-95 cursor-pointer ${u.isCosmic ? 'cosmic-upgrade text-white' : canAfford ? 'bg-blue-50/80 border-blue-100 shadow-sm' : 'bg-gray-50 border-gray-100 opacity-50 grayscale'}`;
            div.onclick = () => {
                if(state.energy >= u.cost) {
                    state.energy -= u.cost;
                    u.count++;
                    u.cost = Math.floor(u.cost * 1.6);
                    saveGame();
                    updateDisplay();
                    showToast(`¡Mejora: ${u.name}!`);
                }
            };
            div.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-2xl shadow-sm">${u.emoji}</div>
                    <div>
                        <p class="font-black text-xs uppercase tracking-tight">${u.name}</p>
                        <p class="text-[10px] font-bold ${u.isCosmic ? 'text-blue-200' : 'text-blue-400'}">Nivel ${u.count}</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="font-black text-sm">${formatNumber(u.cost)}</p>
                    <p class="text-[8px] font-bold opacity-50 uppercase">Gotas</p>
                </div>
            `;
            return div;
        }

        function clickEnergy(e) {
            if(!gameActive) return;
            const clickPower = (1 + state.upgrades.manual.reduce((acc, u) => acc + (u.power * u.count), 0)) * getTotalMultiplier();
            state.energy += clickPower;
            
            // Texto flotante
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.style.color = '#1e40af';
            text.innerText = `+${formatNumber(clickPower)}`;
            text.style.left = e.clientX + 'px'; text.style.top = e.clientY + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 1000);

            // Ripple effect
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX + 'px'; ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
            
            createParticles(e.clientX, e.clientY);
            updateDisplay();
        }

        function createParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 8 + 4;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.background = `rgba(59, 130, 246, ${Math.random() * 0.5 + 0.3})`;
                p.style.borderRadius = '50%';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                p.style.setProperty('--tx', `${(Math.random()-0.5)*150}px`);
                p.style.setProperty('--ty', `${(Math.random()-0.5)*150}px`);
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 700);
            }
        }

        function hatchEgg() {
            if (state.energy >= state.costs.egg) {
                state.energy -= state.costs.egg;
                const p = PET_TYPES[Math.floor(Math.random() * PET_TYPES.length)];
                state.pets.push(p);
                state.costs.egg = Math.floor(state.costs.egg * 1.9);
                saveGame();
                updateDisplay();
                showToast(`¡Sérum obtenido: ${p.name}!`);
            }
        }

        function doRebirth() {
            if (state.energy >= state.costs.rebirth) {
                state.rebirths++;
                state.energy = 0;
                state.upgrades = generateUpgrades();
                state.costs.rebirth *= 8;
                state.costs.egg = 2500;
                saveGame();
                updateDisplay();
                closeModal();
                showToast("¡Piel renovada! Poder X2");
            }
        }

        function showTab(t) {
            if(!gameActive) return;
            const modal = document.getElementById('modal-container');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
            
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            document.getElementById('modal-title').innerText = t === 'shop' ? 'Farmacia' : t === 'pets' ? 'Laboratorio' : 'Nueva Piel';
        }

        function closeModal() {
            const box = document.getElementById('modal-box');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('modal-container').classList.add('hidden');
            }, 200);
        }

        function renderPets() {
            const list = document.getElementById('pets-list');
            if(!list) return;
            list.innerHTML = '';
            state.pets.slice(-12).forEach(p => {
                const d = document.createElement('div');
                d.className = 'bg-white p-3 rounded-2xl text-center shadow-sm border-b-4 transition-transform hover:scale-110';
                d.style.borderColor = p.color;
                d.innerHTML = `<p class="text-2xl">${p.emoji}</p><p class="text-[9px] font-black" style="color:${p.color}">x${p.mult}</p>`;
                list.appendChild(d);
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            t.style.transform = 'translateY(15px)';
            setTimeout(() => { 
                t.style.opacity = '0';
                t.style.transform = 'translateY(0)';
            }, 2000);
        }

        function resetGame() {
            if(confirm("¿Seguro que quieres borrar toda tu rutina?")) {
                localStorage.removeItem('cerave_visual_v1');
                location.reload();
            }
        }

        // Loop principal (10 FPS para suavidad)
        setInterval(() => {
            if(!gameActive) return;
            const autoPower = state.upgrades.auto.reduce((acc, u) => acc + (u.power * u.count), 0) * getTotalMultiplier();
            if(autoPower > 0) {
                state.energy += autoPower / 10;
                document.getElementById('energy-display').innerText = formatNumber(state.energy);
            }
        }, 100);

        // Guardado automático
        setInterval(() => { if(gameActive) saveGame(); }, 15000);

        document.getElementById('click-btn').addEventListener('mousedown', clickEnergy);
        window.onload = loadGame;
    </script>
</body>
</html>
