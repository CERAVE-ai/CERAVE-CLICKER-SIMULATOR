<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeraVe Clicker Simulator - High Progression</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #f0f9ff 0%, #bae6fd 100%);
            color: #1e40af;
            overflow: hidden;
            user-select: none;
        }

        /* Burbujas de fondo */
        .bg-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: floatBubble 10s linear infinite;
            z-index: 0;
        }

        @keyframes floatBubble {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* Pantalla de Inicio */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #loading-screen.hidden { transform: translateY(-100%); }

        .play-button {
            background: #1e40af;
            color: white;
            padding: 20px 60px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* Animación del Bote */
        .bottle-container {
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 20px 30px rgba(30, 64, 175, 0.2));
        }

        .bottle-container:active { transform: scale(0.92) skewX(2deg); }

        .floating-bottle { animation: idleFloat 4s ease-in-out infinite; }
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(-1deg); }
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border: 4px solid #3b82f6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rippleAnim 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes rippleAnim {
            0% { width: 0; height: 0; opacity: 0.8; border-width: 8px; }
            100% { width: 250px; height: 250px; opacity: 0; border-width: 1px; }
        }

        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 10px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .cosmic-upgrade {
            background: linear-gradient(45deg, #1e1b4b, #312e81, #4338ca);
            background-size: 200% 200%;
            animation: gradientMove 3s infinite, pulseCosmic 2s infinite alternate;
            border: 2px solid #fbbf24 !important;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseCosmic {
            from { box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
            to { box-shadow: 0 0 30px rgba(251, 191, 36, 0.9); }
        }

        .floating-text {
            position: absolute;
            pointer-events: none;
            animation: textRise 1s ease-out forwards;
            font-weight: 900;
            z-index: 60;
        }

        @keyframes textRise {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div id="bg-elements"></div>

    <!-- Pantalla de Inicio -->
    <div id="loading-screen">
        <div class="mb-10 scale-150 relative">
            <svg width="100" height="130" viewBox="0 0 120 160">
                <rect x="25" y="45" width="70" height="110" rx="10" fill="white" stroke="#1e40af" stroke-width="3"/>
                <rect x="25" y="55" width="70" height="40" fill="#1e40af"/>
                <text x="60" y="82" font-family="Arial" font-size="14" font-weight="900" fill="white" text-anchor="middle">CeraVe</text>
            </svg>
        </div>
        <h1 class="text-6xl font-black text-blue-900 mb-2 text-center">CERAVE CLICKER</h1>
        <p class="text-blue-400 font-bold mb-10 tracking-widest uppercase">Evolución Progresiva</p>
        <button class="play-button" onclick="startGame()">EMPEZAR RUTINA</button>
    </div>

    <!-- UI Principal -->
    <div id="game-ui" class="contents">
        <!-- Stats -->
        <div class="fixed top-0 left-0 w-full p-6 flex justify-around bg-white/60 backdrop-blur-md border-b border-white/20 z-40 shadow-lg">
            <div class="text-center">
                <p class="text-[10px] text-blue-400 uppercase font-black">Hidratación</p>
                <p id="energy-display" class="text-2xl font-extrabold text-blue-700">0</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] text-blue-400 uppercase font-black">Poder</p>
                <p id="multiplier-display" class="text-2xl font-extrabold text-sky-500">x1</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] text-blue-400 uppercase font-black">Rebirths</p>
                <p id="rebirth-display" class="text-2xl font-extrabold text-indigo-800">0</p>
            </div>
        </div>

        <main id="game-area" class="relative w-full h-full flex items-center justify-center overflow-hidden">
            <div id="click-btn" class="bottle-container floating-bottle relative z-10 cursor-pointer">
                <div class="absolute inset-0 bg-blue-400/20 blur-[100px] rounded-full scale-150 animate-pulse"></div>
                <svg width="240" height="320" viewBox="0 0 120 160" fill="none">
                    <path d="M45 5 C45 5 45 2 60 2 C75 2 75 5 75 5 L75 15 L45 15 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
                    <rect x="56" y="15" width="8" height="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
                    <rect x="35" y="30" width="50" height="8" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
                    <path d="M25 45 C25 40 30 38 35 38 L85 38 C90 38 95 40 95 45 L95 145 C95 152 90 155 85 155 L35 155 C30 155 25 152 25 145 Z" fill="white" stroke="#1e40af" stroke-width="2.5"/>
                    <rect x="25" y="55" width="70" height="40" fill="#1e40af"/>
                    <text x="60" y="82" font-family="Arial" font-size="14" font-weight="900" fill="white" text-anchor="middle">CeraVe</text>
                </svg>
            </div>
        </main>

        <!-- Navegación -->
        <div class="fixed bottom-8 w-full max-w-sm px-6 z-40">
            <div class="bg-white/90 backdrop-blur-xl border border-white rounded-[2.5rem] flex justify-between p-2 shadow-2xl">
                <button onclick="showTab('shop')" class="flex-1 py-4 flex flex-col items-center">
                    <span class="text-2xl">🧴</span>
                    <span class="text-[9px] uppercase font-black text-blue-800">Tienda</span>
                </button>
                <button onclick="showTab('pets')" class="flex-1 py-4 flex flex-col items-center">
                    <span class="text-2xl">✨</span>
                    <span class="text-[9px] uppercase font-black text-blue-800">Sérums</span>
                </button>
                <button onclick="showTab('rebirth')" class="flex-1 py-4 flex flex-col items-center">
                    <span class="text-2xl">🔄</span>
                    <span class="text-[9px] uppercase font-black text-blue-800">Rutina</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-container" class="fixed inset-0 bg-blue-900/40 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-lg rounded-[3rem] shadow-2xl flex flex-col max-h-[80vh] overflow-hidden" id="modal-box">
            <div class="p-8 border-b flex justify-between items-center">
                <h2 id="modal-title" class="text-2xl font-black text-blue-900">Farmacia</h2>
                <button onclick="closeModal()" class="text-blue-300 text-4xl">&times;</button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto custom-scroll">
                <div id="tab-shop" class="tab-content active space-y-4">
                    <div id="shop-manual" class="space-y-3"></div>
                    <div id="shop-auto" class="space-y-3 pt-4 border-t border-blue-50"></div>
                </div>
                <div id="tab-pets" class="tab-content space-y-6 text-center">
                    <div class="bg-blue-50 p-8 rounded-3xl border border-blue-100">
                        <div class="text-6xl mb-4">🧪</div>
                        <button onclick="hatchEgg()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">
                            Mezclar Sérum (<span id="cost-egg">2,500</span>)
                        </button>
                    </div>
                    <div id="pets-list" class="grid grid-cols-4 gap-3"></div>
                </div>
                <div id="tab-rebirth" class="tab-content space-y-6 text-center">
                    <div class="bg-indigo-600 p-10 rounded-3xl text-white">
                        <p class="text-4xl font-black">PODER X5 PERMANENTE</p>
                        <p class="text-sm opacity-80 mt-2">Reinicia mejoras pero multiplica tu fuerza x5.</p>
                    </div>
                    <button onclick="doRebirth()" class="w-full bg-blue-900 text-white py-5 rounded-2xl font-black">
                        Hacer Rebirth (<span id="rebirth-cost-display">1M</span>)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-24 bg-blue-900 text-white px-6 py-3 rounded-full text-xs font-bold shadow-xl opacity-0 transition-all pointer-events-none z-50"></div>

    <script>
        let gameActive = false;
        
        function formatNumber(num) {
            if (num >= 1e18) return (num / 1e18).toFixed(2) + 'Qt';
            if (num >= 1e15) return (num / 1e15).toFixed(2) + 'Q';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return Math.floor(num).toLocaleString();
        }

        const PET_TYPES = [
            { name: 'Ácido Hialurónico', emoji: '💧', mult: 2.0, color: '#0ea5e9' },
            { name: 'Retinol Puro', emoji: '🌙', mult: 10.0, color: '#6366f1' },
            { name: 'Vitamina C', emoji: '💎', mult: 50.0, color: '#fbbf24' },
            { name: 'Ceramida Galáctica', emoji: '🛡️', mult: 500.0, color: '#1e40af' }
        ];

        function createBackground() {
            const container = document.getElementById('bg-elements');
            for(let i=0; i<15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bg-bubble';
                bubble.style.width = (Math.random() * 40 + 20) + 'px';
                bubble.style.height = bubble.style.width;
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(bubble);
            }
        }

        function generateUpgrades() {
            const manual = [];
            const auto = [];
            const iconsM = ['🧼', '🧽', '🧤', '🧴', '🛁', '🚿', '🧖', '💆', '✨', '💎'];
            const iconsA = ['💧', '🌊', '🌬️', '🌨️', '⚡', '🔋', '🤖', '🖥️', '🛰️', '☄️'];

            // Generar 100 mejoras manuales con escalado ALTO
            for(let i=0; i<100; i++) {
                manual.push({
                    id: `m${i}`,
                    name: `Limpieza Nvl ${i+1}`,
                    cost: Math.floor(25 * Math.pow(1.8, i)),
                    power: Math.floor(2 * Math.pow(2.1, i)),
                    count: 0,
                    emoji: iconsM[i % iconsM.length]
                });
            }

            // Generar 100 mejoras automáticas con escalado MUY ALTO
            for(let j=0; j<100; j++) {
                auto.push({
                    id: `a${j}`,
                    name: `Auto-Lote Nvl ${j+1}`,
                    cost: Math.floor(250 * Math.pow(2.0, j)),
                    power: Math.floor(20 * Math.pow(2.3, j)),
                    count: 0,
                    emoji: iconsA[j % iconsA.length]
                });
            }

            // EL CERAVE CÓSMICO (Poder Definitivo)
            auto.push({
                id: 'cosmic',
                name: 'CeraVe Cósmico',
                cost: 1e15, // 1 Quadrillion
                power: 1e12, // 1 Trillion por segundo
                count: 0,
                emoji: '🌌',
                isCosmic: true
            });

            return { manual, auto };
        }

        let state = { 
            energy: 0, 
            rebirths: 0, 
            pets: [], 
            upgrades: generateUpgrades(), 
            costs: { egg: 2500, rebirth: 1000000 }
        };

        function startGame() {
            document.getElementById('loading-screen').classList.add('hidden');
            gameActive = true;
            createBackground();
            loadGame();
            updateDisplay();
        }

        function loadGame() {
            const saved = localStorage.getItem('cerave_pro_v3_high');
            if (saved) {
                const p = JSON.parse(saved);
                state.energy = p.energy || 0;
                state.rebirths = p.rebirths || 0;
                state.pets = p.pets || [];
                state.costs = p.costs || state.costs;
                if(p.upgrades) {
                    p.upgrades.manual.forEach((u, i) => { if(state.upgrades.manual[i]) state.upgrades.manual[i].count = u.count; });
                    p.upgrades.auto.forEach((u) => { 
                        const found = state.upgrades.auto.find(curr => curr.id === u.id);
                        if(found) found.count = u.count;
                    });
                }
            }
        }

        function saveGame() {
            localStorage.setItem('cerave_pro_v3_high', JSON.stringify(state));
        }

        function getTotalMultiplier() {
            // Rebirth ahora da x5 cada uno para progresión masiva
            return (Math.pow(5, state.rebirths)) * (1 + state.pets.reduce((acc, p) => acc + (p.mult - 1), 0));
        }

        function updateDisplay() {
            document.getElementById('energy-display').innerText = formatNumber(state.energy);
            document.getElementById('multiplier-display').innerText = 'x' + formatNumber(getTotalMultiplier());
            document.getElementById('rebirth-display').innerText = state.rebirths;
            document.getElementById('cost-egg').innerText = formatNumber(state.costs.egg);
            document.getElementById('rebirth-cost-display').innerText = formatNumber(state.costs.rebirth);
            renderShop();
            renderPets();
        }

        function renderShop() {
            const mCont = document.getElementById('shop-manual');
            const aCont = document.getElementById('shop-auto');
            if(!mCont || !aCont) return;

            mCont.innerHTML = '<p class="text-[10px] font-black text-blue-300 uppercase tracking-widest">Mejoras de Click Pro</p>';
            aCont.innerHTML = '<p class="text-[10px] font-black text-blue-300 uppercase tracking-widest">Sistemas de Hidratación</p>';

            const visibleManual = state.upgrades.manual.filter((u, i) => u.count > 0 || (i === 0 || state.upgrades.manual[i-1].count > 0)).slice(0, 100);
            const visibleAuto = state.upgrades.auto.filter((u, i) => u.count > 0 || (i === 0 || state.upgrades.auto[i-1].count > 0)).slice(0, 101);

            visibleManual.forEach(u => mCont.appendChild(createItem(u)));
            visibleAuto.forEach(u => aCont.appendChild(createItem(u)));
        }

        function createItem(u) {
            const div = document.createElement('div');
            const currentCost = Math.floor(u.cost * Math.pow(1.6, u.count));
            const canAfford = state.energy >= currentCost;
            
            div.className = `p-4 rounded-2xl flex justify-between items-center border-2 cursor-pointer transition-all active:scale-95 ${u.isCosmic ? 'cosmic-upgrade text-white' : canAfford ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-gray-100 opacity-60'}`;
            
            div.onclick = () => {
                const clickCost = Math.floor(u.cost * Math.pow(1.6, u.count));
                if(state.energy >= clickCost) {
                    state.energy -= clickCost;
                    u.count++;
                    saveGame();
                    updateDisplay();
                    showToast(`+${u.name} NVL ${u.count}`);
                }
            };

            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="text-2xl">${u.emoji}</span>
                    <div>
                        <p class="font-black text-xs">${u.name}</p>
                        <p class="text-[9px] opacity-60 uppercase font-bold">Nivel ${u.count}</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="font-black text-xs">${formatNumber(currentCost)}</p>
                    <p class="text-[8px] opacity-40 font-bold uppercase">Gotas</p>
                </div>
            `;
            return div;
        }

        function clickEnergy(e) {
            if(!gameActive) return;
            const power = (1 + state.upgrades.manual.reduce((acc, u) => acc + (u.power * u.count), 0)) * getTotalMultiplier();
            state.energy += power;

            // FX
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX + 'px'; ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);

            const txt = document.createElement('div');
            txt.className = 'floating-text text-blue-600 drop-shadow-md';
            txt.innerText = `+${formatNumber(power)}`;
            txt.style.left = e.clientX + 'px'; txt.style.top = (e.clientY - 20) + 'px';
            document.body.appendChild(txt);
            setTimeout(() => txt.remove(), 1000);

            updateDisplay();
        }

        function hatchEgg() {
            if(state.energy >= state.costs.egg) {
                state.energy -= state.costs.egg;
                const p = PET_TYPES[Math.floor(Math.random() * PET_TYPES.length)];
                state.pets.push({...p});
                state.costs.egg = Math.floor(state.costs.egg * 2.5);
                saveGame();
                updateDisplay();
                showToast(`¡Sérum ${p.name} activado!`);
            }
        }

        function doRebirth() {
            if(state.energy >= state.costs.rebirth) {
                state.rebirths++;
                state.energy = 0;
                state.upgrades = generateUpgrades();
                state.costs.rebirth *= 50; // Aumento masivo de coste de rebirth
                state.costs.egg = 2500;
                saveGame();
                updateDisplay();
                closeModal();
                showToast("¡EVOLUCIÓN COMPLETADA! PODER x5");
            }
        }

        function showTab(t) {
            if(!gameActive) return;
            document.getElementById('modal-container').classList.remove('hidden');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            document.getElementById('modal-title').innerText = t === 'shop' ? 'Tienda Especializada' : t === 'pets' ? 'Mezclas Químicas' : 'Reinicio de Rutina';
            renderShop();
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function renderPets() {
            const list = document.getElementById('pets-list');
            if(!list) return;
            list.innerHTML = '';
            // Mostrar últimos 12 sérums
            state.pets.slice(-12).forEach(p => {
                const d = document.createElement('div');
                d.className = 'bg-white p-2 rounded-xl border-b-4 text-center shadow-sm';
                d.style.borderColor = p.color;
                d.innerHTML = `<p class="text-xl">${p.emoji}</p><p class="text-[8px] font-bold">x${p.mult}</p>`;
                list.appendChild(d);
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 1500);
        }

        // Loop principal (Auto-Clicker optimizado para alta frecuencia)
        setInterval(() => {
            if(!gameActive) return;
            const auto = state.upgrades.auto.reduce((acc, u) => acc + (u.power * u.count), 0) * getTotalMultiplier();
            if(auto > 0) {
                state.energy += auto / 10;
                document.getElementById('energy-display').innerText = formatNumber(state.energy);
            }
        }, 100);

        document.getElementById('click-btn').addEventListener('mousedown', clickEnergy);
    </script>
</body>
</html>
